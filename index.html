<!DOCTYPE html>
<!-- Mosaico. The UAM / Faculty logo is not part of the licensed work (see LICENSE and NOTICE). -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co https://cdn.jsdelivr.net; object-src 'none'; base-uri 'none'; form-action 'none'">
<script>
// Anti-clickjacking: the app refuses to be shown inside a frame.
if (top !== self) document.documentElement.style.display = 'none';
</script>
<title>Mosaico</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root {
  --g: #52733e;
  --gt: var(--g);
  --bg: #fff;
  --tx: #1b1b1b;
  --mu: #6b6b6b;
  --bd: #d9d9d9;
  --cd: #f4f4f4;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --bg: #151515;
    --tx: #ededed;
    --mu: #a0a0a0;
    --bd: #333;
    --cd: #212121;
    --gt: #8fc077;
  }
}
:root[data-theme='dark'] {
  --bg: #151515;
  --tx: #ededed;
  --mu: #a0a0a0;
  --bd: #333;
  --cd: #212121;
  --gt: #8fc077;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font:
    15px/1.45 Calibri,
    'Segoe UI',
    system-ui,
    sans-serif;
}
main {
  max-width: 980px;
  margin: 0 auto;
  padding: 12px 16px;
}
h1 {
  font-size: 32px;
  line-height: 1.1;
  color: var(--gt);
  margin: 0;
  letter-spacing: 0.3px;
}
h2 {
  font-size: 17px;
  margin: 16px 0 4px;
}
input,
select,
button,
textarea {
  font: inherit;
  color: var(--tx);
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: 6px;
  padding: 8px 10px;
  min-height: 40px;
}
button {
  cursor: pointer;
  background: var(--cd);
}
button.p {
  background: var(--g);
  border-color: var(--g);
  color: #fff;
  font-weight: 600;
}
:focus-visible {
  outline: 2px solid var(--g);
  outline-offset: 2px;
}
nav {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 2px solid var(--bd);
  max-width: 980px;
  margin: 0 auto;
  padding: 0 16px;
}
nav button {
  flex: none;
  white-space: nowrap;
  border: 0;
  border-radius: 0;
  background: none;
  border-bottom: 3px solid transparent;
  margin-bottom: -2px;
  color: var(--mu);
}
nav button.on {
  border-color: var(--g);
  color: var(--tx);
  font-weight: 600;
}
.row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  margin: 10px 0;
}
.row > input,
.row > select {
  flex: 1 1 150px;
}
ul {
  list-style: none;
  padding: 0;
  margin: 8px 0;
}
li {
  display: flex;
  align-items: center;
  gap: 6px;
  border-bottom: 1px solid var(--bd);
  padding: 4px 0;
}
li .who {
  flex: 1;
  display: flex;
  gap: 4px 10px;
  flex-wrap: wrap;
  align-items: baseline;
}
li small {
  color: var(--mu);
}
.empty {
  color: var(--mu);
}
.ib {
  min-height: 36px;
  min-width: 36px;
  padding: 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.ib[data-del]:hover {
  color: #b3261e;
  border-color: #b3261e;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chip {
  min-height: 34px;
  padding: 4px 12px;
  border-radius: 17px;
  border-color: var(--g);
}
.chip.off {
  text-decoration: line-through;
  color: var(--mu);
  border-color: var(--bd);
  opacity: 0.75;
}
details {
  margin: 8px 0;
}
summary {
  cursor: pointer;
  color: var(--mu);
}
textarea {
  width: 100%;
  min-height: 90px;
}
.hint {
  color: var(--mu);
  font-size: 13px;
  margin: 6px 0;
}
.lang {
  display: inline-flex;
}
.lang button {
  min-height: 34px;
  padding: 2px 10px;
  border-radius: 0;
}
.lang button:first-child {
  border-radius: 6px 0 0 6px;
}
.lang button:last-child {
  border-radius: 0 6px 6px 0;
  border-left: 0;
}
.lang button.on {
  background: var(--g);
  border-color: var(--g);
  color: #fff;
}
.top {
  background: #fff;
  border-bottom: 4px solid var(--g);
  --bg: #fff;
  --tx: #1b1b1b;
  --bd: #d9d9d9;
  --cd: #f4f4f4;
  color: #1b1b1b;
}
.inner {
  max-width: 980px;
  margin: 0 auto;
  padding: 10px 16px;
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
}
.logo {
  height: 46px;
  max-width: 100%;
}
.intro {
  max-width: 980px;
  margin: 0 auto;
  padding: 18px 16px 8px;
}
.tag {
  font-size: 17px;
  font-weight: 600;
  margin: 4px 0 0;
}
.credit {
  max-width: 980px;
  margin: 28px auto 14px;
  padding: 0 16px;
  font-size: 12px;
  color: var(--mu);
}
.demo {
  background: var(--cd);
  border-left: 4px solid var(--g);
  padding: 10px 16px;
  font-size: 14px;
}
.demo > div {
  max-width: 980px;
  margin: 0 auto;
}
#gate {
  display: none;
}
.gate-in {
  max-width: 420px;
  margin: 24px auto;
  padding: 16px;
  border: 1px solid var(--bd);
  border-radius: 10px;
}
.gate-demo {
  margin: 18px 0 6px;
  padding-top: 14px;
  border-top: 1px solid var(--bd);
}
body.lock #gate {
  display: block;
}
body.lock nav,
body.lock main,
body.lock #courseBox,
body.lock #credit,
body.boot #credit,
body.boot #courseBox,
body.boot nav,
body.boot main {
  display: none;
}
body:not(.staff) .staff-only,
body:not(.admin) .admin-only,
body:not(.admin) nav {
  display: none !important;
}
/* Printable sheet */
.sheet {
  background: #fff;
  color: #1b1b1b;
  border: 1px solid var(--bd);
  padding: 28px 32px;
  margin-top: 10px;
  font-size: 13.5px;
}
.sheet .logo {
  height: 56px;
}
.sub {
  margin: 6px 0 22px;
  color: #555;
}
.cols {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 40px;
}
.tm {
  margin-bottom: 20px;
  break-inside: avoid;
}
.th {
  display: inline-block;
  min-width: 9.5em;
  background: var(--g);
  color: #fff;
  font-weight: 700;
  padding: 2px 6px;
  margin-bottom: 3px;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}
.r {
  display: grid;
  grid-template-columns: 1.7em 1.5fr 0.9fr 1.1fr;
  gap: 0 6px;
  padding: 1px 0;
  font-size: 12.5px;
}
.r span:nth-child(n + 3) {
  color: #444;
}
.fi {
  width: 1.3em;
  height: 1em;
  object-fit: cover;
  vertical-align: -0.12em;
  border: 1px solid rgba(0, 0, 0, 0.25);
}
#out.edit .r,
#out.edit .th {
  cursor: pointer;
}
#out.edit .r:hover {
  background: #eef3ec;
}
.r.sel {
  background: #dcebd5;
  outline: 2px solid var(--g);
}
@media screen and (max-width: 640px) {
  .cols {
    grid-template-columns: 1fr;
  }
  .sheet {
    padding: 16px;
  }
}
dialog {
  border: 1px solid var(--bd);
  border-radius: 8px;
  background: var(--bg);
  color: var(--tx);
}
/* Info tooltips, sliders, indicators, login */
.tip {
  min-height: 0;
  width: 20px;
  height: 20px;
  padding: 0;
  border-radius: 50%;
  font-size: 12px;
  line-height: 18px;
  position: relative;
  color: var(--mu);
  font-weight: 700;
}
.tip::after {
  content: attr(data-text);
  display: none;
  position: absolute;
  left: 0;
  top: 26px;
  width: min(260px, 72vw);
  background: #222;
  color: #fff;
  padding: 8px 10px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 400;
  text-align: left;
  z-index: 20;
  line-height: 1.35;
}
.tip:hover::after,
.tip.open::after {
  display: block;
}
.sliders {
  display: grid;
  gap: 12px;
  margin: 8px 0;
}
.slider .srow {
  display: flex;
  align-items: center;
  gap: 8px;
}
.slider output {
  margin-left: auto;
  font-weight: 600;
}
.slider input[type='range'] {
  width: 100%;
  min-height: 0;
  padding: 0;
}
.ends {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--mu);
}
.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 10px;
  margin: 10px 0;
}
.kpi {
  background: var(--cd);
  border-radius: 8px;
  padding: 8px 10px;
}
.kpi .kl {
  font-size: 13px;
  color: var(--mu);
  display: flex;
  align-items: center;
  gap: 6px;
}
.kpi .bar {
  height: 6px;
  background: var(--bd);
  border-radius: 3px;
  margin: 6px 0 2px;
  overflow: hidden;
}
.kpi .bar i {
  display: block;
  height: 100%;
  background: var(--g);
}
.kpi b {
  font-size: 20px;
}
body:not(.accounts) [data-tab='users'],
body:not(.accounts) #usersPane,
body:not(.accounts) [data-tab='subjects'],
body:not(.accounts) #subjectsPane {
  display: none !important;
}
.savebar {
  position: sticky;
  top: 0;
  z-index: 5;
  background: var(--bg);
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  padding: 8px 0;
  border-bottom: 1px solid var(--bd);
}
.savebar .hint {
  margin: 0;
}
/* Subjects editor: one block per subject; the name is the field itself, teachers are a tick list */
li.subj {
  display: block;
  padding: 10px 0 10px 12px;
  border-left: 3px solid transparent;
}
li.subj.changed {
  border-left-color: var(--g);
}
.subj-head {
  display: flex;
  gap: 6px;
  align-items: center;
}
.subj-name {
  flex: 1;
  min-width: 0;
  font-weight: 600;
}
.subj-name:hover,
.subj-name:focus {
  border-color: var(--g);
}
.smeta {
  display: block;
  min-height: 0;
  padding-left: 6px;
  color: var(--gt);
  font-size: 12px;
}
.smeta:empty {
  display: none;
}
.picker {
  margin: 4px 0 0;
  padding-left: 6px;
}
.picker summary {
  padding: 6px 0 2px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.picker[open] summary {
  white-space: normal;
}
.picker summary:hover {
  color: var(--tx);
}
.picker .tcount {
  color: var(--tx);
  font-weight: 600;
}
.picker .tnone {
  font-style: italic;
}
.tsearch {
  width: 100%;
  margin: 6px 0 0;
}
.tgrid {
  max-height: 264px;
  overflow-y: auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 2px 12px;
  margin: 6px 0 2px;
  padding: 8px 10px;
  background: var(--cd);
  border-radius: 6px;
}
.tpick {
  display: flex;
  gap: 8px;
  align-items: center;
  min-height: 36px;
  cursor: pointer;
  overflow-wrap: anywhere;
}
.tpick[hidden] {
  display: none;
}
.tpick .trole {
  color: var(--gt);
  font-size: 12px;
  font-weight: 600;
}
.tpick .tstale {
  color: #b3261e;
  font-size: 12px;
}
.tnomatch {
  grid-column: 1 / -1;
}
.tpick input {
  min-height: 0;
  width: 18px;
  height: 18px;
  margin: 0;
  flex: none;
  accent-color: var(--g);
}
button:disabled {
  opacity: 0.5;
  cursor: default;
}
/* In-page notices (replace the browser's alert / confirm / prompt) */
#toast {
  position: fixed;
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: 12px;
  right: 12px;
  display: grid;
  gap: 8px;
  justify-items: center;
  z-index: 1300;
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  max-width: 520px;
  width: 100%;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  background: #222;
  color: #fff;
  border-left: 5px solid #8fc077;
  padding: 10px 12px;
  border-radius: 8px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
}
.toast.warn {
  border-color: #f0b429;
}
.toast.error {
  border-color: #e5534b;
}
.toast span {
  flex: 1;
  white-space: pre-line;
}
.toast button {
  min-height: 0;
  background: none;
  border: 0;
  color: #fff;
  font-size: 20px;
  line-height: 1;
  padding: 0 4px;
}
#modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  display: grid;
  place-items: center;
  z-index: 1200;
}
#modal[hidden] {
  display: none;
}
.modal-card {
  background: var(--bg);
  color: var(--tx);
  border-radius: 10px;
  padding: 16px;
  width: min(420px, 92vw);
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
}
.modal-card p {
  margin: 0 0 6px;
}
.modal-card input {
  width: 100%;
  margin: 6px 0;
}
/* Tour */
#hl {
  position: fixed;
  border-radius: 8px;
  box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55);
  outline: 3px solid #8fc077;
  pointer-events: none;
  z-index: 1000;
  transition: all 0.2s;
}
#ov {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  z-index: 1000;
}
#card {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  max-width: 460px;
  margin: 0 auto;
  background: #fff;
  color: #1b1b1b;
  border-radius: 10px;
  padding: 12px 16px 4px;
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
  z-index: 1002;
  --bg: #fff;
  --tx: #1b1b1b;
  --bd: #d9d9d9;
  --cd: #f4f4f4;
}
#card b {
  font-size: 16px;
  color: var(--g);
}
#card p {
  margin: 4px 0 0;
}
@media print {
  @page {
    size: A4 landscape;
    margin: 12mm;
  }
  body {
    background: #fff;
  }
  .np {
    display: none !important;
  }
  main {
    max-width: none;
    padding: 0;
  }
  .sheet {
    border: 0;
    padding: 0;
    margin: 0;
  }
}
</style>
</head>
<body>
<div id="demoBar" class="demo np" hidden><div>
 <b data-i="demoTitle"></b>: <span data-i="demoText"></span>
 <span class="row" style="display:inline-flex;margin:4px 0 4px 8px">
  <label><span data-i="viewAs"></span> <select id="viewAs"><option value="a" data-i="viewAdmin"></option><option value="c" data-i="viewCoordinator"></option><option value="p" data-i="viewProfessor"></option></select></label>
  <button id="demoReset" data-i="demoReset"></button><button class="p" id="demoExit" data-i="demoExit"></button>
 </span>
</div></div>
<div id="localBar" class="demo np" hidden><div>
 <b data-i="localTitle"></b>: <span data-i="localText"></span>
</div></div>
<div class="top np"><div class="inner">
 <img class="logo" id="logo" alt="">
 <div class="row" style="margin:0">
  <span class="lang" role="group" aria-label="Language"><button id="langEs">ES</button><button id="langEn">EN</button></span>
  <label id="courseBox"><span data-i="course"></span> <select id="course"></select></label>
  <button class="p" id="demoBtn" data-i="demo"></button>
  <button id="myPassBtn" data-i="myPassword" hidden></button>
  <button id="loginBtn" hidden></button>
 </div>
</div></div>
<dialog id="editDlg" class="np">
 <div class="row"><input id="eName" data-ph="phName"><select id="eCountry"></select><input id="eCareer" data-ph="phCareer" list="careers"></div>
 <div class="row"><button class="p" id="eSave" data-i="saveChanges"></button><button id="eCancel" data-i="cancel"></button></div>
 <p class="hint" id="eMsg"></p>
</dialog>
<div class="intro np">
 <h1>Mosaico</h1>
 <p class="tag" data-i="tagline"></p>
</div>
<div id="gate" class="np"><div class="gate-in">
 <h2 data-i="loginTitle"></h2>
 <p class="hint" data-i="gateTitle"></p>
 <div class="row"><input id="user" data-ph="phUser" autocomplete="username" autocapitalize="none"><input id="pass" type="password" data-ph="phPass" autocomplete="current-password"></div>
 <div class="row"><button class="p" id="loginGo" data-i="signIn"></button></div>
 <p class="hint" id="loginMsg"></p>
 <p class="hint gate-demo" data-i="gateDemoHint"></p>
 <button id="gateDemo" data-i="demo"></button>
</div></div>
<nav class="np">
 <button class="on" data-tab="students" data-i="tabStudents"></button>
 <button data-tab="teams" data-i="tabTeams"></button>
 <button class="admin-only" data-tab="users" data-i="tabUsers"></button>
 <button class="admin-only" data-tab="subjects" data-i="tabSubjects"></button>
</nav>
<main>
<section id="studentsPane" class="np admin-only">
 <h2 data-i="studentsTitle"></h2>
 <p class="hint" data-i="studentsHint"></p>
 <div class="row" id="addRow">
  <input id="fName" data-ph="phName" autocomplete="off">
  <select id="fCountry"></select>
  <input id="fCareer" data-ph="phCareer" list="careers" autocomplete="off">
  <datalist id="careers"></datalist>
  <button class="p" id="addBtn" data-i="add"></button>
 </div>
 <details class="staff-only" id="importBox">
  <summary data-i="importSummary"></summary>
  <textarea id="importText" data-ph="importPh"></textarea>
  <button id="importBtn" data-i="import"></button>
 </details>
 <div class="hint" id="count"></div>
 <ul id="list"></ul>
 <button class="p staff-only" id="nextBtn" data-i="next"></button>
</section>

<section id="teamsPane" hidden>
 <div class="np">
  <h2 class="staff-only" data-i="teamsTitle"></h2>
  <details class="staff-only" id="attBox">
   <summary id="attSummary"></summary>
   <p class="hint" data-i="attHint"></p>
   <div id="chips" class="chips"></div>
  </details>
  <div class="row staff-only" id="sizeRow">
   <label><span data-i="teamSize"></span> <input id="size" type="number" min="2" max="10" value="5" style="width:70px"></label>
   <button class="p" id="genBtn" data-i="generate"></button>
  </div>
  <details class="staff-only" id="wBox">
   <summary data-i="advanced"></summary>
   <p class="hint" data-i="advHint"></p>
   <div class="sliders" id="sliders"></div>
  </details>
 </div>
 <div class="np">
  <div class="staff-only" id="roundMeta">
   <h2 data-i="saveTitle"></h2>
   <div class="row">
    <select id="subjectSel"></select>
    <input id="subjectOther" data-ph="phSubjectOther" hidden>
    <input id="roundDate" type="date">
    <input id="activity" data-ph="phActivity">
    <button class="p" id="saveBtn" data-i="save"></button>
   </div>
  </div>
  <h2 data-i="roundsTitle"></h2>
  <div class="row">
   <select id="roundSel"></select>
   <button class="admin-only" id="delBtn" data-i="delete"></button>
   <button class="p" id="pdfBtn" data-i="pdf"></button>
  </div>
 </div>
 <div class="np">
  <div class="kpis" id="kpis"></div>
  <p class="hint staff-only" id="adjHint" hidden><span data-i="adjHint"></span> <button id="undoBtn" data-i="undo"></button></p>
 </div>
 <div class="sheet" id="out"></div>
</section>
<section id="usersPane" class="np admin-only" hidden>
 <h2 data-i="usersTitle"></h2>
 <p class="hint" data-i="usersHint"></p>
 <div class="row">
  <input id="uName" data-ph="phUser" autocomplete="off" autocapitalize="none">
  <input id="uPass" type="password" data-ph="phNewPass" autocomplete="new-password">
  <select id="uRole"></select>

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const norm = (s) =>
  String(s)
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .trim();
const uid = () => Math.random().toString(36).slice(2, 9);
const todayISO = () => new Date().toLocaleDateString('sv-SE');
const pairKey = (a, b) => (a < b ? a + '|' + b : b + '|' + a);
const indexById = (list) => new Map(list.map((x) => [x.id, x]));
const clone = (x) => JSON.parse(JSON.stringify(x));
const flip = (on, ...names) => names.forEach((n) => document.body.classList.toggle(n, on));
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
} // Fisher–Yates

const TOAST_MAX = 3; // at most this many notices on screen; the oldest goes first
function notify(message, kind = 'info') {
  const box = $('toast'),
    ms = kind === 'error' ? 9000 : 5000;
  // the same notice again (e.g. a button pressed several times) refreshes the one on screen instead of stacking
  const same = [...box.children].find((x) => x.dataset.msg === message);
  if (same) {
    clearTimeout(same.timer);
    same.timer = setTimeout(() => same.remove(), ms);
    return;
  }
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.dataset.msg = message;
  el.innerHTML = `<span>${esc(message)}</span><button type="button" aria-label="×">×</button>`;
  el.querySelector('button').onclick = () => el.remove();
  box.appendChild(el);
  while (box.children.length > TOAST_MAX) {
    box.firstElementChild.remove();
  }
  el.timer = setTimeout(() => el.remove(), ms);
}
function ask(message, { input = false, type = 'text', ok } = {}) {
  // resolves true/false, or the typed text (null if cancelled) when input is requested
  return new Promise((resolve) => {
    const box = $('modalInput');
    $('modalText').textContent = message;
    box.hidden = !input;
    box.type = type;
    box.value = '';
    $('modalOk').textContent = ok || t('ok');
    $('modalCancel').textContent = t('cancel');
    $('modal').hidden = false;
    (input ? box : $('modalOk')).focus();
    const done = (v) => {
      $('modal').hidden = true;
      $('modalOk').onclick = $('modalCancel').onclick = box.onkeydown = $('modal').onkeydown = null;
      resolve(v);
    };
    $('modalOk').onclick = () => done(input ? box.value : true);
    $('modalCancel').onclick = () => done(input ? null : false);
    box.onkeydown = (e) => {
      if (e.key === 'Enter') {
        $('modalOk').click();
      }
    };
    $('modal').onkeydown = (e) => {
      if (e.key === 'Escape') {
        $('modalCancel').click();
      }
    };
  });
}

/* ---------- 4. Repositories ----------
   Strategy + Template Method: the app talks to one interface (MemoryRepo); each subclass
   only decides where changes are stored (browser, Supabase, or nowhere for the demo). */
class MemoryRepo {
  constructor(courses = {}) {
    this.courses = courses;
  }

  course(name) {
    this.courses[name] ??= { students: [], rounds: [] };
    return this.courses[name];
  }

  courseNames() {
    return Object.keys(this.courses);
  }

  async load() {}

  async addStudents(courseName, students) {
    this.course(courseName).students.push(...students);
    return this.persist('add', courseName, students);
  }

  async updateStudent(courseName, student) {
    return this.persist('update', courseName, student);
  }

  async removeStudent(courseName, id) {
    removeById(this.course(courseName).students, id);
    return this.persist('remove', courseName, id);
  }

  async addRound(courseName, round) {
    this.course(courseName).rounds.push(round);
    return this.persist('addRound', courseName, round);
  }

  async removeRound(courseName, id) {
    removeById(this.course(courseName).rounds, id);
    return this.persist('removeRound', courseName, id);
  }

  /** Every write goes through here and resolves to false when the store refuses it. */
  async persist() {}
}

const removeById = (list, id) => {
  const index = list.findIndex((item) => item.id === id);
  if (index >= 0) {
    list.splice(index, 1);
  }
};

class LocalRepo extends MemoryRepo {
  static STORAGE_KEY = 'mosaico-db';

  constructor() {
    let saved = {};

      saved = JSON.parse(localStorage.getItem(LocalRepo.STORAGE_KEY)) || {};
    } catch {

    }

    } catch {

    }
  }
}

class RemoteRepo extends MemoryRepo {
  static OPERATIONS = {
    add: {
      table: 'students',
      error: 'errSave',
      run: (query, courseName, students) => query.insert(students.map((s) => studentRow(courseName, s))),
    },
    update: {
      table: 'students',
      error: 'errEdit',
      run: (query, courseName, s) =>
        query.update({ name: s.name, country: s.country, career: s.career }).eq('id', s.id),
    },
    remove: { table: 'students', error: 'errDelete', run: (query, courseName, id) => query.delete().eq('id', id) },
    addRound: {
      table: 'rounds',
      error: 'errSave',
      run: (query, courseName, round) => query.insert([roundRow(courseName, round)]),
    },
    removeRound: { table: 'rounds', error: 'errDelete', run: (query, courseName, id) => query.delete().eq('id', id) },
  };

  constructor(client) {
    super();
    this.client = client;
  }

  async load(courseName) {
    const read = (table) => this.client.from(table).select('*').eq('course', courseName).order('created_at');
    const [students, rounds] = await Promise.all([read('students'), read('rounds')]);
    if (students.error || rounds.error) {
      notify(t('errConn'), 'error');
      return;
    }
    Object.assign(this.course(courseName), { students: students.data, rounds: rounds.data });
  }

  async persist(operation, courseName, payload) {
    const { table, error: messageKey, run } = RemoteRepo.OPERATIONS[operation];
    const { error } = await run(this.client.from(table), courseName, payload);
    if (error) {
      notify(t(messageKey, error.message), 'error');
      await this.load(courseName);
    }
    return !error;
  }
}

/* ---------- 5. TeamSolver ----------
   Simulated annealing over team assignments. Data structures chosen for the hot loop:
   students are integer slots; countries and areas are interned to small ints; pair history is a flat
   Float32Array matrix (O(1) lookups, no string keys); team counts reuse two Int16Arrays. */
class TeamSolver {
  constructor(students, everyone, rounds, weights) {
    const n = (this.n = students.length);
    this.w = weights;
    this.ids = students.map((p) => p.id);
    const slot = new Map(this.ids.map((id, i) => [id, i])),
      intern = (m, k) => (m.has(k) ? m.get(k) : (m.set(k, m.size), m.size - 1));
    const countries = new Map(),
      areas = new Map();
    this.country = Int16Array.from(students, (p) => intern(countries, p.country));
    this.area = Int16Array.from(students, (p) => intern(areas, areaOf(p.career)));
    this.countryCount = new Int16Array(countries.size);
    this.areaCount = new Int16Array(areas.size);
    // History → pair penalties (recent rounds weigh more) and each student's average past team diversity.
    this.pen = new Float32Array(n * n);
    const total = new Float64Array(n),
      seen = new Int16Array(n),
      tally = (m, k) => m.set(k, (m.get(k) || 0) + 1),
      sq = (m) => [...m.values()].reduce((s, v) => s + v * v, 0);
    rounds.forEach((round, ri) => {
      const decay = Math.pow(0.85, rounds.length - 1 - ri);
      round.teams.forEach((ids) => {
        const team = ids.map((id) => everyone.get(id)).filter(Boolean),
          m = team.length;
        if (m < 2) {
          return;
        }
        const c = new Map(),
          a = new Map();
        team.forEach((s) => {
          tally(c, s.country);
          tally(a, areaOf(s.career));
        });
        const diversity = 1 - (sq(c) + sq(a)) / (2 * m * m),
          slots = team.map((s) => slot.get(s.id));
        slots.forEach((x, i) => {
          if (x === undefined) {
            return;
          }
          total[x] += diversity;
          seen[x]++;
          for (let j = i + 1; j < m; j++) {
            const y = slots[j];
            if (y !== undefined) {
              this.pen[x * n + y] += decay;
              this.pen[y * n + x] += decay;
            }
          }
        });
      });
    });
    let sum = 0,
      known = 0;
    for (let i = 0; i < n; i++) {
      if (seen[i]) {
        sum += total[i] / seen[i];
        known++;
      }
    }
    this.mean = known ? sum / known : 0.5;
    this.score = Float64Array.from({ length: n }, (_, i) => (seen[i] ? total[i] / seen[i] : this.mean));
  }
  /** Cost of one team (array of slots): lower is better. */
  cost(team) {
    const m = team.length;
    if (!m) {
      return 0;
    }
    const { country, area, countryCount: cc, areaCount: ac, pen, n, w, score, mean } = this;
    let sc = 0,
      sa = 0,
      p = 0;
    for (let i = 0; i < m; i++) {
      const x = team[i];
      sc += 2 * cc[country[x]]++ + 1;
      sa += 2 * ac[area[x]]++ + 1; // running sum of squared counts
      for (let j = i + 1; j < m; j++) {
        p += pen[x * n + team[j]];
      }
    }
    const diversity = 1 - (sc + sa) / (2 * m * m);
    let fairness = 0;
    for (const x of team) {
      cc[country[x]] = 0;
      ac[area[x]] = 0;
      fairness += (score[x] - mean) * diversity;
    }
    return (w.country * sc) / m + (w.career * sa) / m + w.pairs * p + w.equity * 5 * fairness;
  }
  /** Returns teams of student ids. */
  solve(size, { restarts = 4, iterations = 25000 } = {}) {
    const count = Math.max(2, Math.round(this.n / size));
    let best = null,
      bestCost = Infinity;
    for (let r = 0; r < restarts; r++) {
      const order = shuffle([...this.ids.keys()]).sort((a, b) => this.country[a] - this.country[b]); // deal each country across the teams
      const teams = Array.from({ length: count }, () => []);
      order.forEach((x, i) => teams[i % count].push(x));
      const costs = teams.map((tm) => this.cost(tm));
      for (let it = 0; it < iterations; it++) {
        const temp = 1.5 * (1 - it / iterations) + 0.01,
          a = (Math.random() * count) | 0,
          b = (Math.random() * count) | 0;
        if (a === b) {
          continue;
        }
        const i = (Math.random() * teams[a].length) | 0,
          j = (Math.random() * teams[b].length) | 0,
          x = teams[a][i],
          y = teams[b][j];
        teams[a][i] = y;
        teams[b][j] = x;
        const ca = this.cost(teams[a]),
          cb = this.cost(teams[b]),
          delta = ca + cb - costs[a] - costs[b];
        if (delta <= 0 || Math.random() < Math.exp(-delta / temp)) {
          costs[a] = ca;
          costs[b] = cb;
        } else {
          teams[a][i] = x;
          teams[b][j] = y;
        }
      }
      const sum = costs.reduce((s, c) => s + c, 0);
      if (sum < bestCost) {
        bestCost = sum;
        best = teams.map((tm) => tm.slice());
      }
    }
    return best.map((tm) => tm.map((x) => this.ids[x]));
  }
}

/* ---------- 6. Draft ----------
   A generated, unsaved set of teams. Every edit takes a snapshot first (Memento), which makes undo trivial. */
class Draft {
  constructor(teams) {
    this.teams = teams;
    this.history = [];
    this.title = '';
    this.date = '';
  }
  snapshot() {
    this.history.push(clone(this.teams));
  }
  locate(id) {
    for (let i = 0; i < this.teams.length; i++) {
      const j = this.teams[i].indexOf(id);
      if (j >= 0) {
        return [i, j];
      }
    }
  }
  swap(a, b) {
    const [ta, i] = this.locate(a),
      [tb, j] = this.locate(b);
    this.snapshot();
    this.teams[ta][i] = b;
    this.teams[tb][j] = a;
  }
  move(id, to, compare) {
    const [from, i] = this.locate(id);
    if (from === to) {
      return true;
    }
    if (this.teams[from].length < 2) {
      return false;
    }
    this.snapshot();
    this.teams[from].splice(i, 1);
    this.teams[to].push(id);
    this.teams[to].sort(compare);
    return true;
  }
  undo() {
    if (this.history.length) {
      this.teams = this.history.pop();
    }
  }
}

/* ---------- 7. Metrics ---------- */
function teamMetrics(teams, everyone, rounds) {
  const met = new Set();
  rounds.forEach((r) =>
    r.teams.forEach((tm) =>
      tm.forEach((x, i) => {
        for (let j = i + 1; j < tm.length; j++) {
          met.add(pairKey(x, tm[j]));
        }
      })
    )
  );
  let repeats = 0,
    pairs = 0,
    countryVariety = 0,
    careerVariety = 0;
  for (const tm of teams) {
    const members = tm.map((id) => everyone.get(id)).filter(Boolean),
      m = tm.length || 1;
    tm.forEach((x, i) => {
      for (let j = i + 1; j < tm.length; j++) {
        pairs++;
        if (met.has(pairKey(x, tm[j]))) {
          repeats++;
        }
      }
    });
    countryVariety += new Set(members.map((p) => p.country)).size / m;
    careerVariety += new Set(members.map((p) => areaOf(p.career))).size / m;
  }
  const n = teams.length || 1,
    pct = (v) => Math.round(v * 100);
  return {
    country: pct(countryVariety / n),
    career: pct(careerVariety / n),
    fresh: pairs ? pct(1 - repeats / pairs) : 100,
  };
}

/* ---------- 10. PDF export ---------- */
class PdfExporter {
  constructor(round, students) {
    this.round = round;
    this.by = students;
    this.flags = {};
    this.doc = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    const g = getComputedStyle(document.documentElement).getPropertyValue('--g').trim();
    this.green = [1, 3, 5].map((i) => parseInt(g.substr(i, 2), 16));
  }
  async flagPNG(c) {
    const canvas = document.createElement('canvas');
    canvas.width = 96;
    canvas.height = 72;
    const ctx = canvas.getContext('2d');
    try {
      const svg = (await (await fetch(FLAG_URL(c))).text()).replace('<svg ', '<svg width="640" height="480" ');
      const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
      const img = await new Promise((ok, no) => {
        const i = new Image();
        i.onload = () => ok(i);
        i.onerror = no;
        i.src = url;
      });
      ctx.drawImage(img, 0, 0, 96, 72);
      URL.revokeObjectURL(url);
    } catch {
      // offline: fall back to the device's emoji flag
      ctx.font = '56px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      ctx.fillText(flagEmoji(c), 20, 56);
    }
    return canvas.toDataURL('image/png');
  }
  plain(s) {
    return String(s).replace(new RegExp(PdfExporter.NON_LATIN.source, 'g'), '?');
  }
  fit(s, w) {
    s = String(s);
    let x = s;
    while (x.length > 1 && this.doc.getTextWidth(x) > w) {
      x = x.slice(0, -1);
    }
    return x === s ? s : x.trimEnd() + '…';
  }
  text(s, x, y, w) {
    // text the PDF font cannot draw (CJK, Cyrillic…) is drawn as an image instead
    s = String(s);
    if (!PdfExporter.NON_LATIN.test(s)) {
      this.doc.text(this.fit(s, w), x, y);
      return;
    }
    const k = document.createElement('canvas');
    k.width = Math.round(w * 12);
    k.height = 56;
    const c = k.getContext('2d');
    c.fillStyle = '#1e1e1e';
    c.font = '40px "Noto Sans","Segoe UI",system-ui,sans-serif';
    const tw = Math.min(c.measureText(s).width, k.width);
    c.fillText(s, 0, 42, k.width);
    this.doc.addImage(k.toDataURL('image/png'), 'PNG', x, y - 3.5, Math.max(tw / 12, 1), 4.7);
  }
  header() {
    const d = this.doc,
      r = this.round;
    d.addImage(LOGO, 'JPEG', 15, 10, 85, 10.3);
    d.setFont('helvetica', 'normal');
    d.setFontSize(10);
    d.setTextColor(90);
    d.text(
      this.plain(programCourse() + ' · ' + (r.title || t('workTeams')) + (r.date ? ' · ' + fmtDate(r.date) : '')),
      15,
      27
    );
    return 36;
  }
  column(blocks, x, top) {
    const d = this.doc;
    let y = top;
    for (const b of blocks) {
      d.setFillColor(...this.green);
      d.rect(x, y, 40, 5.5, 'F');
      d.setFont('helvetica', 'bold');
      d.setFontSize(10);
      d.setTextColor(255);
      d.text(this.plain(t('teamN', b.n)), x + 2, y + 3.9);
      y += 9.5;
      d.setFont('helvetica', 'normal');
      d.setFontSize(9.5);
      d.setTextColor(30);
      for (const s of b.students) {
        d.addImage(this.flags[s.country], 'PNG', x, y - 3.4, 5.6, 4.2);
        this.text(s.name, x + 8, y, 50);
        this.text(regionName(s.country), x + 61, y, 27);
        this.text(s.career, x + 91, y, 35);
        y += PdfExporter.ROW;
      }
      y += 5;
    }
  }
  async save() {
    const blocks = this.round.teams.map((ids, i) => ({
      n: i + 1,
      students: ids.map((id) => this.by.get(id)).filter(Boolean),
    }));
    const countries = new Set(blocks.flatMap((b) => b.students.map((p) => p.country)));
    await Promise.all(
      [...countries].map(async (c) => {
        this.flags[c] = await this.flagPNG(c);
      })
    );
    const blockHeight = (b) => 14 + b.students.length * PdfExporter.ROW;
    let i = 0,
      top = this.header();
    while (i < blocks.length) {
      // fill the page two columns at a time; the first half of each page goes left
      let perColumn = 0,
        h = 0;
      for (let j = i; j < blocks.length; j++) {
        h += blockHeight(blocks[j]);
        if (top + h > 203) {
          break;
        }
        perColumn++;
      }
      const page = blocks.slice(i, i + 2 * Math.max(perColumn, 1)),
        half = Math.ceil(page.length / 2);
      this.column(page.slice(0, half), 15, top);
      this.column(page.slice(half), 155, top);
      i += page.length;
      if (i < blocks.length) {
        this.doc.addPage();
        top = this.header();
      }
    }
    const name = ('Mosaico_' + state.course + '_' + (this.round.title || 'teams'))
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/[^A-Za-z0-9_-]+/g, '-');
    this.doc.save(name + '.pdf');
  }
}
PdfExporter.ROW = 4.6;
PdfExporter.NON_LATIN = /[^\u0020-\u007E\u00A0-\u00FF\u2013\u2014\u2019\u2026\u2022]/;
$('pdfBtn').onclick = async () => {

  }
  try {
    await new PdfExporter(r, everyone()).save();
  } catch (e) {

  }
};

const tour = {
  steps: [],
  i: 0,
  startTab: 'students',
  start() {
    this.steps = TOUR.filter((s) => (!s.need || can(s.need)) && (!s.sel || document.querySelector(s.sel)));
    this.startTab = $('studentsPane').hidden ? 'teams' : 'students';
    this.i = 0;
    $('card').hidden = false;
    this.show();
  },
  hide() {
    $('card').hidden = true;
    $('hl').hidden = true;
    $('ov').hidden = true;
  },
  end() {
    this.hide();
    tab(can('admin') ? this.startTab : 'teams');
    window.scrollTo(0, 0);
  },
  place() {
    if ($('card').hidden) {
      return;
    }
    const s = this.steps[this.i],
      el = s.sel && document.querySelector(s.sel),
      hl = $('hl');
    if (!el) {
      hl.hidden = true;
      $('ov').hidden = false;
      return;

    $('ov').hidden = true;
    const r = el.getBoundingClientRect(),
      pad = 6;
    Object.assign(hl.style, {
      top: r.top - pad + 'px',
      left: r.left - pad + 'px',
      width: r.width + 2 * pad + 'px',
      height: r.height + 2 * pad + 'px',
    });
    hl.hidden = false;
  },
  show() {
    const s = this.steps[this.i];
    if (s.tab) {
      tab(s.tab);
    }
    if (s.pre) {
      s.pre();
    }
    const el = s.sel && document.querySelector(s.sel);
    if (el) {
      if (el.tagName === 'DETAILS') {
        el.open = true;
      }
      window.scrollTo(0, Math.max(0, el.getBoundingClientRect().top + window.scrollY - 90));
    }
    $('tourTitle').textContent = t('tour.' + s.key + '.t');
    $('tourText').textContent = s.text ? s.text() : t('tour.' + s.key + '.x');
    $('tourPrev').hidden = this.i === 0;
    $('tourNext').textContent = this.i === this.steps.length - 1 ? t('tourFinish') : t('tourNext');
    this.place();
  },
};

/* ---------- 13b. Subjects and teachers (admin panel) ----------
   In shared mode the catalog lives in two tables: subjects, and subject_teachers (which teacher may use which subject).
   The admin edits a working copy (subjectDraft); nothing is written until "Save changes", and "Discard" drops the copy.
   The database enforces the rule (see schema.sql); this panel is only the editor. */
let subjectDraft = null,
  subjectSeq = 0;
const openPickers = new Set(); // keys of the subjects whose teacher list is unfolded, kept across re-renders
// Each draft row remembers the name it has in the database (orig; null = new), so a rename is told apart from remove + add.
const cloneCatalog = (c) => c.map((s) => ({ key: 's' + ++subjectSeq, name: s.name, orig: s.name, teachers: [...s.teachers] }));
const catalogSig = (c) => JSON.stringify(c.map((s) => [s.name, [...s.teachers].sort()]));
const subjectsDirty = () => !!subjectDraft && catalogSig(subjectDraft) !== catalogSig(state.catalog);
async function loadCatalog() {
  const [s, st] = await Promise.all([
    client.from('subjects').select('name').order('position').order('name'),
    client.from('subject_teachers').select('email,subject'),
  ]);
  if (s.error || st.error) {
    notify(t('errConn'), 'error');
    return;
  }
  state.catalog = s.data.map((x) => ({
    name: x.name,
    teachers: st.data
      .filter((r) => r.subject === x.name)
      .map((r) => r.email)
      .sort(),
  }));
}
function catalogDiff(from, to) {
  // what saving would change in the database
  const was = new Map(from.map((s) => [s.name, s.teachers])),
    kept = new Set(to.filter((s) => s.orig).map((s) => s.orig));
  const d = {
    dropped: from.filter((s) => !kept.has(s.name)).map((s) => s.name),
    renamed: to.filter((s) => s.orig && s.orig !== s.name).map((s) => ({ from: s.orig, to: s.name })),
    added: [],
    assigned: [],
    unassigned: [],
  };
  to.forEach((s, i) => {
    const old = (s.orig && was.get(s.orig)) || [];
    if (!s.orig) {
      d.added.push({ name: s.name, position: i + 1 });
    }
    s.teachers.filter((e) => !old.includes(e)).forEach((email) => d.assigned.push({ email, subject: s.name }));
    old.filter((e) => !s.teachers.includes(e)).forEach((email) => d.unassigned.push({ email, subject: s.name }));
  });
  return d;
}
function subjectNameProblem(list) {
  // every name filled in and none repeated (accents and case ignored)
  const seen = new Set();
  for (const s of list) {
    const n = norm(s.name);
    if (!n) {
      return t('needSubjectName');
    }
    if (seen.has(n)) {
      return t('dupSubjectNamed', s.name);
    }
    seen.add(n);
  }
  return '';
}

}

function subjectMeta(s) {

  if (!s.orig) {

}
function pickerHtml(s, staff) {

      .map(
        (u) =>
          `<label class="tpick" data-email="${esc(u.username)}"><input type="checkbox" data-tkey="${k}" value="${esc(u.username)}"${s.teachers.includes(u.username) ? ' checked' : ''}><span>${esc(u.username)}</span>` +
          (u.role === 'coordinator' ? `<small class="trole">${esc(t('profileCoordinator'))}</small>` : '') +
          (u.role === null ? `<small class="tstale">${esc(t('noTeachingAccount'))}</small>` : '') +
          '</label>'
      )
      .join('')}<p class="hint tnomatch" hidden>${esc(t('noTeacherMatch'))}</p></div>`
  );
}
function renderSubjectsAdmin() {
  const list = subjectDraft || state.catalog.map((s) => ({ ...s, key: s.name, orig: s.name })),
    staff = staffList();
  $('subjectList').innerHTML = list.length
    ? list
        .map((s) => {
          const k = esc(s.key),
            meta = subjectMeta(s);
          return (
            `<li class="subj${meta ? ' changed' : ''}" data-row="${k}">` +
            `<div class="subj-head"><input class="subj-name" data-sname="${k}" value="${esc(s.name)}" maxlength="200" autocomplete="off" aria-label="${esc(t('subjectNameLabel'))}">` +
            iconButton('data-sdel', s.key, t('removeSubject', s.name), 'bin') +
            `</div><small class="smeta">${meta}</small>` +
            `<details class="picker" data-pick="${k}"${openPickers.has(s.key) ? ' open' : ''}><summary>${subjectSummary(s)}</summary>` +
            pickerHtml(s, staff) +
            '</details></li>'
          );
        })
        .join('')
    : `<li class="empty">${esc(t('noSubjects'))}</li>`;
  syncSubjectsBar();
}
function syncSubjectsBar() {
  const dirty = subjectsDirty();
  $('sSave').disabled = $('sDiscard').disabled = !dirty;
  $('sState').textContent = t(dirty ? 'unsaved' : 'allSaved');
}
const draftRow = (key) => {
  subjectDraft = subjectDraft || cloneCatalog(state.catalog);
  return subjectDraft.find((x) => x.key === key);
};
const refreshRow = (s) => {
  const li = $('subjectList').querySelector(`[data-row="${CSS.escape(s.key)}"]`);
  if (li) {
    const meta = subjectMeta(s);
    li.querySelector('.smeta').innerHTML = meta;
    li.classList.toggle('changed', !!meta);
    li.querySelector('summary').innerHTML = subjectSummary(s);
  }
  syncSubjectsBar();
};
const addSubject = () => {
  const name = $('sName').value.trim();
  if (!name) {
    notify(t('needSubjectName'), 'warn');
    return;
  }
  if ((subjectDraft || state.catalog).some((s) => norm(s.name) === norm(name))) {
    notify(t('dupSubject'), 'warn');
    return;
  }
  subjectDraft = subjectDraft || cloneCatalog(state.catalog);
  const key = 's' + ++subjectSeq;
  subjectDraft.push({ key, name, orig: null, teachers: [] });
  openPickers.add(key); // assigning teachers is the natural next step
  $('sName').value = '';
  renderSubjectsAdmin();
  $('subjectList').lastElementChild.scrollIntoView({ block: 'nearest' });
};
$('sAdd').onclick = addSubject;
$('sBulkAdd').onclick = () => {
  // one subject per line; empty lines and names already in the list are skipped
  subjectDraft = subjectDraft || cloneCatalog(state.catalog);
  const seen = new Set(subjectDraft.map((x) => norm(x.name)));
  let added = 0;
  $('sBulk')
    .value.split('\n')
    .map((l) => l.trim().slice(0, 200))
    .forEach((name) => {
      if (name && !seen.has(norm(name))) {
        seen.add(norm(name));
        subjectDraft.push({ key: 's' + ++subjectSeq, name, orig: null, teachers: [] });
        added++;
      }
    });
  $('sBulk').value = '';
  renderSubjectsAdmin();
  notify(t('subjectsAdded', added));
};
$('sName').onkeydown = (e) => {
  if (e.key === 'Enter') {
    addSubject();
  }
};
$('subjectList').oninput = (e) => {
  if (e.target.dataset.tfind) {
    // filter the tick list of this subject; ticked people stay ticked even when hidden
    const q = norm(e.target.value),
      grid = e.target.nextElementSibling;
    let shown = 0;
    grid.querySelectorAll('.tpick').forEach((l) => {
      const hit = !q || norm(l.dataset.email).includes(q);
      l.hidden = !hit;
      shown += hit;
    });
    grid.querySelector('.tnomatch').hidden = shown > 0;
    return;
  }
  // renaming: the draft follows every keystroke, so Save is ready without leaving the field
  const key = e.target.dataset.sname;
  if (key) {
    const s = draftRow(key);
    s.name = e.target.value.trim();
    refreshRow(s);
  }
};
$('subjectList').onchange = (e) => {
  const el = e.target;
  if (el.dataset.sname) {
    const s = draftRow(el.dataset.sname),
      problem = subjectNameProblem(subjectDraft);
    if (problem) {
      notify(problem, 'warn');
    }
    el.value = s.name;
  } else if (el.dataset.tkey) {
    const s = draftRow(el.dataset.tkey);
    s.teachers = el.checked ? [...s.teachers, el.value].sort() : s.teachers.filter((x) => x !== el.value);
    refreshRow(s);
  }
};
$('subjectList').addEventListener(
  'toggle',
  (e) => {
    const k = e.target.dataset && e.target.dataset.pick;
    if (k) {
      e.target.open ? openPickers.add(k) : openPickers.delete(k);
    }
  },
  true
); // "toggle" does not bubble
$('subjectList').onclick = (e) => {
  const b = e.target.closest('button[data-sdel]');
  if (b) {
    draftRow(b.dataset.sdel);
    subjectDraft = subjectDraft.filter((x) => x.key !== b.dataset.sdel);
    renderSubjectsAdmin();
  }
};
$('sDiscard').onclick = () => {
  subjectDraft = cloneCatalog(state.catalog);
  openPickers.clear();
  renderSubjectsAdmin();
};
$('sSave').onclick = async () => {
  if (!subjectsDirty()) {
    return;
  }
  const problem = subjectNameProblem(subjectDraft);
  if (problem) {
    notify(problem, 'warn');
    return;
  }
  const d = catalogDiff(state.catalog, subjectDraft);
  if (d.dropped.length && !(await ask(t('confirmDropSubjects', d.dropped.join(', ')), { ok: t('saveChanges') }))) {
    return;
  }
  if (state.demo) {
    state.catalog = subjectDraft.map((s) => ({ name: s.name, teachers: [...s.teachers] }));
  } else {
    const db = (table) => client.from(table),
      rename = (from, to) => () => db('subjects').update({ name: to }).eq('name', from), // ON UPDATE CASCADE carries the teachers along
      sources = new Set(d.renamed.map((r) => r.from)),
      swap = d.renamed.some((r) => sources.has(r.to)), // e.g. A→B and B→A: go through temporary names so no step hits an existing key
      tmp = d.renamed.map((r, i) => `~tmp ${Date.now()} ${i}`),
      steps = [
        ...d.dropped.map((name) => () => db('subjects').delete().eq('name', name)), // the teachers of a removed subject go with it (ON DELETE CASCADE)
        ...(swap
          ? [...d.renamed.map((r, i) => rename(r.from, tmp[i])), ...d.renamed.map((r, i) => rename(tmp[i], r.to))]
          : d.renamed.map((r) => rename(r.from, r.to))),
        d.added.length && (() => db('subjects').insert(d.added)),
        ...d.unassigned.map((r) => () => db('subject_teachers').delete().eq('subject', r.subject).eq('email', r.email)),
        d.assigned.length && (() => db('subject_teachers').insert(d.assigned)),
      ].filter(Boolean);
    for (const step of steps) {
      const { error } = await step();
      if (error) {
        notify(t('errUsers', error.message), 'error');
        await loadCatalog();
        subjectDraft = cloneCatalog(state.catalog);
        renderSubjectsAdmin();
        renderSubjects();
        return;
      } // what was written stays and the editor shows the database as it is now, so nothing is applied twice
    }
    await loadCatalog();
  }
  subjectDraft = cloneCatalog(state.catalog);
  openPickers.clear();
  renderSubjectsAdmin();
  renderSubjects();
  notify(t('savedChange'));
};
addEventListener('beforeunload', (e) => {
  if (subjectsDirty()) {
    e.preventDefault();
    e.returnValue = '';
  }
});

/* ---------- 14. Boot ---------- */
$('logo').src = LOGO;
if (!SHARED && navigator.storage && navigator.storage.persist) {
  navigator.storage.persist();
}
buildSliders();
$('roundDate').value = todayISO();
setRole(null);
state.goHome = !SHARED; // local mode has no sign-in: pick the start tab on the first load
applyLang();
(async () => {
  try {
    if (SHARED) {
      await whoami();
    }
  } catch {}
  state.booting = false;
  updateLock();
  await refresh();
})();
</script>
</body>
</html>
